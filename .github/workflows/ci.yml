name: CI Pipeline
on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier Formatting
        run: npm run format:check

      - name: Run Tests
        run: npm test

      - name: Generate Coverage
        run: npm run coverage

      - name: Build Docker Image
        run: docker build -f docker/Dockerfile -t ai-doc-generator .
