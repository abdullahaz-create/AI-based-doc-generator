apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: ai-doc-generator-hpa
  namespace: ai-doc-generator

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-doc-generator

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70